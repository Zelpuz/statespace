[build-system]
requires = ["scikit-build-core>=1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ssfortran"
dynamic = ["version"]
description = "Linear Gaussian state space models (Durbin and Koopman, Part I) with a Fortran core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/lbfgsb/License.txt"]
requires-python = ">=3.10"
dependencies = ["numpy"]
authors = [{ name = "zelpuz" }]
keywords = ["state space", "kalman filter", "kalman smoother", "time series",
            "structural time series", "unobserved components", "durbin koopman"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Source = "https://github.com/Zelpuz/statespace"
Issues = "https://github.com/Zelpuz/statespace/issues"

[project.optional-dependencies]
test = ["pytest"]

[[tool.dynamic-metadata]]
# The single source of the version: the string in the C interface. fpm.toml,
# CMakeLists.txt and docs/conf.py must agree (python/tests/test_version.py).
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "src/statespace_capi.f90"
regex = 'character\(len=\*\), parameter :: version = "(?P<value>[^"]+)"'

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/src/ssfortran"]
# The library is loaded with ctypes, so the wheel is Python-version
# independent but platform specific.
wheel.py-api = "py3"
# The source distribution holds what the build needs. Tests, fixtures (11 MB),
# docs, examples and data stay in the repository.
sdist.exclude = ["build", ".venv", "ref", "private", ".github", "docs", "test",
                 "python/tests", "python/conftest.py", "example", "bench", "data",
                 "project.md", "PLAN.md"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "python/src/ssfortran"]
# The source tree for development; to test an installed wheel instead, run
# pytest -o pythonpath= python/tests
pythonpath = ["python/src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.cibuildwheel]
# One wheel per platform serves every Python version (wheel.py-api above), so
# build with a single interpreter.
build = "cp312-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
# Test the installed wheel against the repository's tests and fixtures.
test-command = "pytest -q -o pythonpath= -o addopts= {project}/python/tests"

[tool.cibuildwheel.linux]
# gfortran matching the image's gcc-toolset, and OpenBLAS for BLAS and LAPACK.
# auditwheel then copies libgfortran, libgomp and libopenblas into the wheel.
before-all = [
  "dnf install -y 'dnf-command(config-manager)'",
  "dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb",
  "dnf install -y $(basename /opt/rh/gcc-toolset-*)-gcc-gfortran openblas-devel",
]
