name = "statespace"
version = "0.1.2"
license = "MIT"
author = "Taylor D. Edwards"
maintainer = "td.edwards@yahoo.com"
copyright = "Copyright 2026, Taylor D. Edwards"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
link = ["lapack", "blas"]
[install]
library = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
# Modern Fortran port of L-BFGS-B 3.0 (Nocedal & Morales), BSD-3, bundled in
# third_party/lbfgsb at commit ce1a9322 (see its README).
lbfgsb.path = "third_party/lbfgsb"

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"
test-drive.rev = "c506771aefd594e7e372240a8027b3fd06d61264"  # v0.6.1

# Fortitude (https://fortitude.readthedocs.io): `fortitude check`. Formatting
# rules only: line length, trailing whitespace, misleading inline-if
# continuations; and syntax errors.
[extra.fortitude.check]
line-length = 88
select = ["S001", "S101", "C152", "E001"]
exclude = ["third_party", "build"]
